name: Publication

on:
  push:
    tags:
      - '*.*.*'

# Aucun droit par défaut : chaque job reçoit uniquement ce dont il a besoin.
permissions: {}

# Deux tags poussés coup sur coup se déploient en série, sans s'annuler.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  BASE_PATH: /mjc_slicer/
  PDF_NAME: mjc-slicer-${{ github.ref_name }}.pdf

jobs:
  build:
    name: Construire le site et le PDF
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Installer Playwright
        run: |
          pnpm add -D -w playwright-chromium
          pnpm exec playwright install-deps chromium

      - name: Construire le site
        run: pnpm exec slidev build --base "$BASE_PATH" --router-mode hash --out dist

      - name: Exporter le PDF
        run: pnpm exec slidev export --format pdf --output "$PDF_NAME" --timeout 60000 --dark

      - name: Vérifier que le PDF n'est pas vide
        run: |
          taille=$(stat -c%s "$PDF_NAME")
          echo "PDF : $taille octets"
          if [ "$taille" -lt 200000 ]; then
            echo "::error::PDF anormalement petit ($taille o) — export probablement vide"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - uses: actions/upload-artifact@v7
        with:
          name: pdf
          path: ${{ env.PDF_NAME }}
          if-no-files-found: error

  deploy:
    name: Déployer sur GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Créer la Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pdf

      - name: Publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes "$PDF_NAME"
